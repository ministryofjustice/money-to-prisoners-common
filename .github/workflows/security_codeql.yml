name: Security CodeQL scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1'
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  codeql:
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_codeql.yml@v2
    with:
      languages: python, javascript-typescript
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
    secrets: inherit
