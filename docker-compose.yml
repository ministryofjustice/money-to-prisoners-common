x-environment: &default-environment
  # apps should define their own environment variables and fallbacks;
  # only docker-compose-specific overrides should go here
  PYTHONUNBUFFERED: "1"

  DEBUG: "True"
  ENV: local

  API_URL: http://api:8000

  # "If Test does it, Parity should too": mirrors the "November 2nd changes" policy flag that
  # money-to-prisoners-deploy sets for the real test/parity environments (see
  # config/{test,parity}/env/bank-admin.yml there). Without it, local behaves like an
  # environment from before that policy change (e.g. Bank Admin still shows Access Pay refund
  # downloads), which doesn't match test/parity and breaks Playwright specs that assert the
  # current behaviour.
  #
  # NOTE: test/parity also set BANK_TRANSFERS_ENABLED: "0" and PRISONER_CAPPING_ENABLED: "1"
  # for send-money/cashbook/noms-ops as part of the same policy change. Don't add those here
  # without first checking the Playwright send-money/cashbook/noms-ops suites: enabling
  # PRISONER_CAPPING_ENABLED locally currently breaks the send-money happy-path spec, because
  # it triggers a NOMIS prisoner lookup this local stack doesn't have data for.
  NOVEMBER_SECOND_CHANGES_LIVE: "1"

services:

  db:
    container_name: mtp-api-db
    image: postgres:16-alpine  # should match version setup in mtp-deploy terraformed rds.db_engine_version
    environment:
      POSTGRES_DB: mtp_api
      POSTGRES_USER: mtp_api
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    container_name: mtp-api
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-api
      dockerfile: Dockerfile-dev
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ../money-to-prisoners-api:/app
      # see docker/no-local-settings.py
      - ./docker/no-local-settings.py:/app/mtp_api/settings/local.py:ro
      - api_node_modules:/app/node_modules
    # Uncomment following lines and restart containers to install money-to-prisoners-common in editable mode
    #   - ../money-to-prisoners-common:/money-to-prisoners-common
    # command: >
    #   bash -c "/venv/bin/python /app/run.py python_dependencies --common-path ../money-to-prisoners-common
    #   && /venv/bin/python /app/run.py serve"
    links:
      - db
    depends_on:
      - db
    user: mtp
    environment:
      <<: *default-environment
      DB_NAME: mtp_api
      DB_USERNAME: mtp_api
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

  cashbook:
    container_name: mtp-cashbook
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-cashbook
      dockerfile: Dockerfile-dev
    ports:
      - "8001:8001"
      - "3001:3001"
    volumes:
      - ../money-to-prisoners-cashbook:/app
      # see docker/no-local-settings.py
      - ./docker/no-local-settings.py:/app/mtp_cashbook/settings/local.py:ro
      - cashbook_node_modules:/app/node_modules
    # Uncomment following lines and restart containers to install money-to-prisoners-common in editable mode
    #   - ../money-to-prisoners-common:/money-to-prisoners-common
    # command: >
    #   bash -c "/venv/bin/python /app/run.py python_dependencies --common-path ../money-to-prisoners-common
    #   && /venv/bin/python /app/run.py serve"
    links:
      - api
    depends_on:
      - api
    user: mtp
    environment: *default-environment

  bank-admin:
    container_name: mtp-bank-admin
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-bank-admin
      dockerfile: Dockerfile-dev
    ports:
      - "8002:8002"
      - "3002:3002"
    volumes:
      - ../money-to-prisoners-bank-admin:/app
      # see docker/no-local-settings.py
      - ./docker/no-local-settings.py:/app/mtp_bank_admin/settings/local.py:ro
      - bank-admin_node_modules:/app/node_modules
    # Uncomment following lines and restart containers to install money-to-prisoners-common in editable mode
    #   - ../money-to-prisoners-common:/money-to-prisoners-common
    # command: >
    #   bash -c "/venv/bin/python /app/run.py python_dependencies --common-path ../money-to-prisoners-common
    #   && /venv/bin/python /app/run.py serve"
    links:
      - api
    depends_on:
      - api
    user: mtp
    environment:
      <<: *default-environment
      # picked up from a gitignored root .env file - see docker/no-local-settings.py for why
      # these can't just go in mtp_bank_admin/settings/local.py
      ZENDESK_API_USERNAME: ${ZENDESK_API_USERNAME:-}
      ZENDESK_API_TOKEN: ${ZENDESK_API_TOKEN:-}
      ZENDESK_REQUESTER_ID: ${ZENDESK_REQUESTER_ID:-}

  noms-ops:
    container_name: mtp-noms-ops
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-noms-ops
      dockerfile: Dockerfile-dev
    ports:
      - "8003:8003"
      - "3003:3003"
    volumes:
      - ../money-to-prisoners-noms-ops:/app
      # see docker/no-local-settings.py
      - ./docker/no-local-settings.py:/app/mtp_noms_ops/settings/local.py:ro
      - noms-ops_node_modules:/app/node_modules
    # Uncomment following lines and restart containers to install money-to-prisoners-common in editable mode
    #   - ../money-to-prisoners-common:/money-to-prisoners-common
    # command: >
    #   bash -c "/venv/bin/python /app/run.py python_dependencies --common-path ../money-to-prisoners-common
    #   && /venv/bin/python /app/run.py serve"
    links:
      - api
    depends_on:
      - api
    user: mtp
    environment: *default-environment

  send-money:
    container_name: mtp-send_money
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-send-money
      dockerfile: Dockerfile-dev
    ports:
      - "8004:8004"
      - "3004:3004"
    volumes:
      - ../money-to-prisoners-send-money:/app
      # see docker/no-local-settings.py
      - ./docker/no-local-settings.py:/app/mtp_send_money/settings/local.py:ro
      - send-money_node_modules:/app/node_modules
    # Uncomment following lines and restart containers to install money-to-prisoners-common in editable mode
    #   - ../money-to-prisoners-common:/money-to-prisoners-common
    # command: >
    #   bash -c "/venv/bin/python /app/run.py python_dependencies --common-path ../money-to-prisoners-common
    #   && /venv/bin/python /app/run.py serve"
    links:
      - api
    depends_on:
      - api
    user: mtp
    environment:
      <<: *default-environment
      # picked up from a gitignored root .env file - see docker/no-local-settings.py for why
      # this can't just go in mtp_send_money/settings/local.py. Uses the GDS Sandbox test key
      # (same one test uses) - safe to share, does not move real money.
      GOVUK_PAY_URL: https://publicapi.payments.service.gov.uk/v1
      GOVUK_PAY_AUTH_TOKEN: ${GOVUK_PAY_AUTH_TOKEN:-}

  start-page:
    container_name: mtp-start-page
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-start-page
      dockerfile: Dockerfile-dev
    ports:
      - "8005:8080"
    user: mtp
    environment: *default-environment

  emails:
    container_name: mtp-emails
    stdin_open: true
    tty: true
    build:
      context: ../money-to-prisoners-emails
      dockerfile: Dockerfile-dev
    ports:
      - "8006:8006"
      - "3006:3006"
    volumes:
      - ../money-to-prisoners-emails:/app
      # see docker/no-local-settings.py
      - ./docker/no-local-settings.py:/app/mtp_emails/settings/local.py:ro
      - emails_node_modules:/app/node_modules
    # Uncomment following lines and restart containers to install money-to-prisoners-common in editable mode
    #   - ../money-to-prisoners-common:/money-to-prisoners-common
    # command: >
    #   bash -c "/venv/bin/python /app/run.py python_dependencies --common-path ../money-to-prisoners-common
    #   && /venv/bin/python /app/run.py serve"
    links:
      - api
    depends_on:
      - api
    user: mtp
    environment:
      <<: *default-environment
      # picked up from a gitignored root .env file - see docker/no-local-settings.py for why
      # this can't just go in mtp_emails/settings/local.py
      GOVUK_NOTIFY_CALLBACKS_BEARER_TOKEN: ${GOVUK_NOTIFY_CALLBACKS_BEARER_TOKEN:-}

volumes:
  db_data:
  api_node_modules:
  cashbook_node_modules:
  bank-admin_node_modules:
  noms-ops_node_modules:
  send-money_node_modules:
  emails_node_modules:
